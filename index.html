<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010a13">
<title>LoL 챔피언 퀴즈</title>
<link rel="preconnect" href="https://ddragon.leagueoflegends.com">
<link rel="preconnect" href="https://raw.communitydragon.org">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header>
  <div class="brand" id="brand">LoL <b>챔피언 퀴즈</b></div>
  <button class="pill" id="verBtn" aria-label="데이터 설정"><span class="dot" id="dot"></span><span id="verTxt">불러오는 중…</span></button>
</header>

<main>
  <section id="home" class="card">
    <h1>실전 롤 퀴즈</h1>
    <p class="sub" id="homeSub">Data Dragon + CommunityDragon 데이터를 불러오는 중입니다…</p>
    <div class="label">난이도 (여러 개 선택)</div>
    <div class="chips" id="tierChips"></div>
    <div class="label">출제 분야</div>
    <div class="chips" id="catChips"></div>
    <div class="label">문제 수</div>
    <div class="chips" id="cntChips"></div>
    <div id="errBox" class="fb" style="border-color:var(--bad)" hidden></div>
    <div style="margin-top:22px"><button class="btn primary block" id="startBtn" disabled>시작하기</button></div>
    <div class="stats">
      <div class="stat"><b id="stBest">-</b><span>최고 정답률</span></div>
      <div class="stat"><b id="stStreak">-</b><span>최고 연속 정답</span></div>
      <div class="stat"><b id="stPts">-</b><span>최고 난이도 점수</span></div>
    </div>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="qmeta"><span id="qCat"></span><span id="qProg"></span></div>
    <div class="bar"><i id="qBar" style="width:0"></i></div>
    <div class="qtier" id="qTier"></div>
    <div id="qBody"></div>
  </section>

  <section id="result" class="card" hidden></section>
</main>

<div class="overlay" id="ov">
  <div class="sheet" role="dialog" aria-label="데이터 설정">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">데이터 & 자동 갱신</h2>
      <button class="btn ghost" id="ovClose" style="min-height:38px;padding:6px 14px">닫기</button>
    </div>
    <dl class="kv" id="kv"></dl>
    <div class="label">버전 추적</div>
    <label class="radio"><input type="radio" name="track" value="latest"><span><b>최신 패치 자동 추적</b><br><span class="mut">새 패치가 나오면 자동으로 데이터를 바꾸고 문제를 다시 만듭니다.</span></span></label>
    <label class="radio"><input type="radio" name="track" value="pinned"><span><b id="pinLabel">고정</b><br><span class="mut">이 버전으로 고정. 새 패치는 알림만 띄웁니다.</span></span></label>
    <div class="label">확인 간격</div>
    <div class="row">
      <select id="pollSel">
        <option value="5">5분마다</option><option value="10">10분마다</option>
        <option value="30">30분마다</option><option value="60">1시간마다</option><option value="180">3시간마다</option>
      </select>
      <button class="btn ghost" id="checkNow" style="min-height:42px">지금 확인</button>
      <button class="btn ghost" id="forceReload" style="min-height:42px">강제 다시 불러오기</button>
    </div>
    <div class="label">데이터 상호 보강 현황</div>
    <div id="fillInfo" class="mut" style="font-size:14px"></div>
    <div class="label">최근 패치 수치 변경</div>
    <div id="chgInfo"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/core.js?v=5"></script>
<script src="js/questions.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
